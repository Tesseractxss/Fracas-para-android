<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fracas (MS-DOS)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <!-- JS-DOS v8 -->
    <script src="https://v3.js-dos.com/8.0/js-dos.js"></script>
    <link href="https://v3.js-dos.com/8.0/js-dos.css" rel="stylesheet">
    <style>
        body, html {
            width: 100%; height: 100%; margin: 0; padding: 0;
            background-color: #000; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        #root {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
        }
        #touch-controls {
            position: absolute; bottom: 20px; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 20px;
            box-sizing: border-box; pointer-events: none; z-index: 100;
        }
        #dpad, #action-btns {
            pointer-events: auto; display: flex; gap: 10px; align-items: center;
        }
        #dpad { text-align: center; }
        .btn {
            background: rgba(255, 255, 255, 0.3); border: 2px solid rgba(255, 255, 255, 0.6);
            color: white; border-radius: 50%; width: 60px; height: 60px;
            font-size: 24px; user-select: none; touch-action: manipulation;
        }
        .btn:active { background: rgba(255, 255, 255, 0.7); }
        .action { border-radius: 10px; font-size: 14px; font-weight: bold; }
        #btn-fullscreen {
            position: absolute; top: 20px; right: 20px; padding: 10px 15px;
            background: rgba(255, 255, 255, 0.3); border: 2px solid rgba(255, 255, 255, 0.6);
            color: white; font-size: 16px; border-radius: 10px; cursor: pointer; z-index: 100;
        }
        #btn-fullscreen:active { background: rgba(255, 255, 255, 0.7); }
    </style>
</head>
<body>
    <div id="root"></div>
    <button id="btn-fullscreen" onclick="ativarTelaCheia()">🔲 Tela Cheia</button>

    <div id="touch-controls">
        <div id="dpad">
            <button class="btn" ontouchstart="simulaTecla(38, true)" ontouchend="simulaTecla(38, false)">⬆️</button><br>
            <button class="btn" ontouchstart="simulaTecla(37, true)" ontouchend="simulaTecla(37, false)">⬅️</button>
            <button class="btn" ontouchstart="simulaTecla(40, true)" ontouchend="simulaTecla(40, false)">⬇️</button>
            <button class="btn" ontouchstart="simulaTecla(39, true)" ontouchend="simulaTecla(39, false)">➡️</button>
        </div>
        <div id="action-btns">
            <button class="btn action" ontouchstart="simulaTecla(13, true)" ontouchend="simulaTecla(13, false)">ENTER</button>
            <button class="btn action" ontouchstart="simulaTecla(32, true)" ontouchend="simulaTecla(32, false)">ESPAÇO</button>
            <button class="btn action" ontouchstart="simulaTecla(17, true)" ontouchend="simulaTecla(17, false)">CTRL</button>
        </div>
    </div>

    <script>
        let ciInstance = null;

        function ativarTelaCheia() {
            let elem = document.documentElement;
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) { elem.requestFullscreen(); }
                else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
                else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                else if (document.msExitFullscreen) { document.msExitFullscreen(); }
            }
        }

        // Função para injetar teclas usando a API nativa do JS-DOS v8
        function simulaTecla(keyCode, isKeyDown) {
            if (ciInstance) {
                ciInstance.sendKeyEvent(keyCode, isKeyDown);
            }
        }

        document.addEventListener('dblclick', function(event) { event.preventDefault(); }, { passive: false });

        // Inicializa JS-DOS v8 e roda o nosso pacote game.zip
        emulators.pathPrefix = "https://v3.js-dos.com/8.0/";
        Dos(document.getElementById("root")).run("game.zip").then(function(ci) {
            // Guarda a Interface de Comando (ci) para os botões virtuais usarem
            ciInstance = ci;
        });
    </script>
</body>
</html>
